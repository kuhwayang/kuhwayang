<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026학년도 6학년 2반 과학 학습방</title>
  <style>
    /* ========================================================
       1. 기본 스타일 및 초기화
       ======================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none; /* 전자칠판에서 터치 시 불필요한 텍스트 드래그 방지 */
    }

    :root {
      --font-main: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --bg-color: #f0f7f6;
      --header-bg: #ffffff;
      --primary-color: #0d9488;       /* 밝고 신뢰감을 주는 청록(Teal) */
      --primary-dark: #0f766e;
      --primary-light: #ccfbf1;
      --active-card-bg: #ffffff;
      --active-border: #14b8a6;
      --disabled-card-bg: #f8fafc;
      --disabled-border: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --accent-badge: #2563eb;
      --shadow-base: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-active: 0 10px 24px rgba(13, 148, 136, 0.18);
      --shadow-active-hover: 0 14px 28px rgba(13, 148, 136, 0.28);
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      line-height: 1.4;
    }

    /* 1920x1080 전자칠판에서 스크롤 없이 한 화면에 딱 맞도록 레이아웃 구성 */
    .app-container {
      width: 100%;
      max-width: 1720px;
      margin: 0 auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    /* ========================================================
       2. 상단 헤더 및 네비게이션
       ======================================================== */
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--header-bg);
      padding: 16px 28px;
      border-radius: 20px;
      box-shadow: var(--shadow-base);
      border: 2px solid #e2e8f0;
    }

    .class-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #f1f5f9;
      color: #334155;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* "🏠 처음으로" 버튼 (../index.html) */
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: #ffffff;
      color: #334155;
      border: 2px solid #cbd5e1;
      padding: 12px 26px;
      border-radius: 14px;
      font-size: 1.35rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .btn-home:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
      transform: translateY(-2px);
    }

    .btn-home:active {
      transform: translateY(1px);
    }

    .btn-home:focus-visible {
      outline: 4px solid var(--primary-color);
      outline-offset: 3px;
    }

    /* 페이지 타이틀 영역 */
    .title-section {
      text-align: center;
      margin: 20px 0 16px 0;
    }

    .main-title {
      font-size: 3.2rem;
      font-weight: 800;
      color: #0f766e;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      letter-spacing: -1px;
    }

    .sub-title {
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 8px;
    }

    /* ========================================================
       3. 단원 선택 카드 그리드
       ======================================================== */
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin: 12px 0 24px 0;
      flex: 1;
    }

    /* 공통 카드 스타일 */
    .unit-card {
      position: relative;
      border-radius: 24px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 230px;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 3px solid transparent;
    }

    /* 활성화된 단원 카드 (5단원 등) */
    .unit-card.active {
      background: linear-gradient(180deg, #ffffff 0%, #f0fdfa 100%);
      border-color: var(--active-border);
      box-shadow: var(--shadow-active);
      cursor: pointer;
    }

    .unit-card.active:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-active-hover);
      border-color: var(--primary-color);
    }

    .unit-card.active:active {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2);
    }

    .unit-card.active:focus-visible {
      outline: 5px solid #0284c7;
      outline-offset: 4px;
    }

    /* 준비 중인 단원 카드 */
    .unit-card.disabled {
      background-color: var(--disabled-card-bg);
      border-color: var(--disabled-border);
      opacity: 0.72;
      cursor: not-allowed;
      pointer-events: none; /* 클릭 및 터치 동작 완전 차단 */
    }

    /* 카드 내부 텍스트 및 시각 요소 */
    .card-top-icon {
      font-size: 2.5rem;
      margin-bottom: 4px;
    }

    .unit-number {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .unit-card.active .unit-number {
      color: #0f172a;
    }

    .unit-card.disabled .unit-number {
      color: #64748b;
    }

    /* 단원 상세명 (필요 시 교사가 기입할 수 있는 자리) */
    .unit-desc {
      font-size: 1.3rem;
      font-weight: 600;
      color: #64748b;
      margin-top: 4px;
      text-align: center;
    }

    /* 카드 하단 액션 뱃지/버튼 */
    .action-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 260px;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-top: 14px;
      transition: background-color 0.2s ease;
    }

    /* 학습하기 버튼 (활성) */
    .action-badge.learn {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3);
    }

    .unit-card.active:hover .action-badge.learn {
      background-color: var(--primary-dark);
    }

    /* 준비 중 뱃지 (비활성) */
    .action-badge.locked {
      background-color: #e2e8f0;
      color: #64748b;
      border: 1px solid #cbd5e1;
    }

    /* ========================================================
       4. 하단 안내 바
       ======================================================== */
    .footer-bar {
      text-align: center;
      padding: 14px 20px;
      background-color: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      font-size: 1.15rem;
      color: #64748b;
      font-weight: 500;
    }

    /* ========================================================
       5. 반응형 미디어 쿼리 (화면 크기에 따른 유연한 대응)
       ======================================================== */
    @media (max-width: 1280px) {
      .unit-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .main-title {
        font-size: 2.6rem;
      }
      .unit-number {
        font-size: 2.3rem;
      }
    }

    @media (max-width: 768px) {
      .app-container {
        padding: 16px;
      }
      .unit-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .main-title {
        font-size: 2.1rem;
      }
      .sub-title {
        font-size: 1.3rem;
      }
      .btn-home {
        font-size: 1.1rem;
        padding: 10px 18px;
      }
      .action-badge {
        font-size: 1.4rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- 상단 내비게이션 바 -->
    <header class="header-nav" role="banner">
      <div class="class-badge" aria-label="학급 정보">
        <span>🏫</span>
        <span>2026학년도 6학년 2반</span>
      </div>

      <!-- 메인 과목 선택(홈)으로 돌아가는 버튼 -->
      <a href="../index.html" class="btn-home" aria-label="메인 전체 과목 선택 화면으로 이동">
        <span>🏠</span>
        <span>처음으로</span>
      </a>
    </header>

    <!-- 메인 타이틀 영역 -->
    <section class="title-section" aria-labelledby="main-heading">
      <h1 id="main-heading" class="main-title">
        <span>🔬</span>
        <span>과학 학습방</span>
      </h1>
      <p class="sub-title">공부할 단원을 선택해요!</p>
    </section>

    <!-- 단원 선택 카드 목록 (2행 3열 그리드) -->
    <main class="unit-grid" role="region" aria-label="과학 단원 목록">

      <!-- ======================================================
           [1단원] 준비 중
           * 추후 활성화 방법:
             1. class를 "unit-card active" 로 변경
             2. href="./unit01/index.html" 로 설정
             3. aria-disabled="false" 로 변경
             4. locked 뱃지를 learn 뱃지로 교체
           ====================================================== -->
      <!-- 1단원 -->
      <div class="unit-card disabled" aria-disabled="true" role="button">
        <div class="card-top-icon" aria-hidden="true">🌱</div>
        <div class="unit-number">1단원</div>
        <div class="action-badge locked" aria-label="1단원은 현재 준비 중입니다">
          <span>🔒</span>
          <span>준비 중</span>
        </div>
      </div>

      <!-- ======================================================
           [2단원] 준비 중
           ====================================================== -->
      <!-- 2단원 -->
      <div class="unit-card disabled" aria-disabled="true" role="button">
        <div class="card-top-icon" aria-hidden="true">⚡</div>
        <div class="unit-number">2단원</div>
        <div class="action-badge locked" aria-label="2단원은 현재 준비 중입니다">
          <span>🔒</span>
          <span>준비 중</span>
        </div>
      </div>

      <!-- ======================================================
           [3단원] 준비 중
           ====================================================== -->
      <!-- 3단원 -->
      <div class="unit-card disabled" aria-disabled="true" role="button">
        <div class="card-top-icon" aria-hidden="true">☀️</div>
        <div class="unit-number">3단원</div>
        <div class="action-badge locked" aria-label="3단원은 현재 준비 중입니다">
          <span>🔒</span>
          <span>준비 중</span>
        </div>
      </div>

      <!-- ======================================================
           [4단원] 준비 중
           ====================================================== -->
      <!-- 4단원 -->
      <div class="unit-card disabled" aria-disabled="true" role="button">
        <div class="card-top-icon" aria-hidden="true">🧪</div>
        <div class="unit-number">4단원</div>
        <div class="action-badge locked" aria-label="4단원은 현재 준비 중입니다">
          <span>🔒</span>
          <span>준비 중</span>
        </div>
      </div>

      <!-- ======================================================
           [5단원] 실제 학습 자료 연결 (활성화)
           - 상대경로: ./unit05/index.html
           ====================================================== -->
      <!-- 5단원 -->
      <a href="./unit05/index.html" class="unit-card active" aria-label="5단원 학습하기 화면으로 이동">
        <div class="card-top-icon" aria-hidden="true">💡</div>
        <div class="unit-number">5단원</div>
        <div class="action-badge learn">
          <span>▶</span>
          <span>학습하기</span>
        </div>
      </a>

      <!-- ======================================================
           [6단원] 준비 중
           ====================================================== -->
      <!-- 6단원 -->
      <div class="unit-card disabled" aria-disabled="true" role="button">
        <div class="card-top-icon" aria-hidden="true">🌍</div>
        <div class="unit-number">6단원</div>
        <div class="action-badge locked" aria-label="6단원은 현재 준비 중입니다">
          <span>🔒</span>
          <span>준비 중</span>
        </div>
      </div>

    </main>

    <!-- 하단 안내 푸터 -->
    <footer class="footer-bar" role="contentinfo">
      <span>터치 스크린(전자칠판)을 가볍게 눌러 공부할 단원을 선택하세요.</span>
    </footer>

  </div>

  <script>
    // 준비 중인 카드 터치/클릭 방지 및 보조 안전장치
    document.addEventListener('DOMContentLoaded', () => {
      const disabledCards = document.querySelectorAll('.unit-card.disabled');
      disabledCards.forEach(card => {
        card.addEventListener('click', (e) => {
          e.preventDefault();
        });
      });
    });
  </script>
</body>
</html>
